<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICE FOR YOU | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <div class="min-h-screen flex flex-col md:flex-row">
        
        <!-- Mobile Header -->
        <header class="md:hidden bg-black text-white p-4 flex justify-between items-center sticky top-0 z-30 shadow-md">
            <h1 class="text-xl font-black tracking-tighter">IFY ADMIN</h1>
            <button id="mobile-menu-btn" class="p-2 active:bg-gray-800 rounded">
                <i data-feather="menu"></i>
            </button>
        </header>

        <!-- Sidebar / Drawer -->
        <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden backdrop-blur-sm transition-opacity"></div>
        
        <aside id="admin-sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-black text-white transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out md:static md:block shadow-2xl md:shadow-none h-full flex flex-col">
            <div class="p-6 flex justify-between items-center border-b border-gray-800">
                <h1 class="text-2xl font-black tracking-tighter">IFY ADMIN</h1>
                <button id="close-sidebar-btn" class="md:hidden text-gray-400 hover:text-white">
                    <i data-feather="x"></i>
                </button>
            </div>
            <nav class="mt-6 space-y-2 px-2 flex-1">
                <button id="nav-products" class="w-full text-left py-3 px-4 bg-gray-900 border-l-4 border-sky-500 hover:bg-gray-800 transition rounded-r-md flex items-center">
                    <i data-feather="package" class="w-4 h-4 mr-3"></i> Products
                </button>
                <button id="nav-collections" class="w-full text-left py-3 px-4 text-gray-400 hover:text-white hover:bg-gray-800 border-l-4 border-transparent transition rounded-r-md flex items-center">
                    <i data-feather="grid" class="w-4 h-4 mr-3"></i> Collections
                </button>
                <button id="nav-media" class="w-full text-left py-3 px-4 text-gray-400 hover:text-white hover:bg-gray-800 border-l-4 border-transparent transition rounded-r-md flex items-center">
                    <i data-feather="film" class="w-4 h-4 mr-3"></i> Media Manager
                </button>
            </nav>
            <div class="p-6 border-t border-gray-800">
                <a href="/" target="_blank" class="flex items-center text-gray-400 hover:text-white transition text-sm font-bold uppercase tracking-widest">
                    <i data-feather="external-link" class="w-4 h-4 mr-2"></i> View Live Site
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-[calc(100vh-60px)] md:h-screen overflow-hidden relative">
            
            <!-- STATUS BAR -->
            <div id="status-msg" class="hidden absolute top-4 left-1/2 transform -translate-x-1/2 z-[60] px-6 py-3 rounded-md bg-green-500 text-white shadow-lg font-bold transition-all text-sm w-[90%] md:w-auto text-center"></div>

            <!-- VIEW: PRODUCTS -->
            <div id="view-products" class="flex-1 flex flex-col h-full">
                <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-4 md:px-8 shrink-0">
                    <h2 class="text-lg font-bold">Products</h2>
                    <button onclick="openModal('product')" class="bg-black hover:bg-gray-800 text-white px-4 py-2 rounded text-sm font-bold flex items-center shadow-sm">
                        <i data-feather="plus" class="w-4 h-4 mr-2"></i> <span class="hidden md:inline">Add Product</span><span class="md:hidden">Add</span>
                    </button>
                </header>

                <div class="p-4 md:p-8 overflow-y-auto flex-1 bg-gray-50">
                    <div class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="min-w-full leading-normal">
                                <thead>
                                    <tr>
                                        <th class="px-5 py-3 border-b-2 border-gray-100 bg-gray-50 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Product</th>
                                        <th class="px-5 py-3 border-b-2 border-gray-100 bg-gray-50 text-left text-xs font-bold text-gray-500 uppercase tracking-wider hidden md:table-cell">Category</th>
                                        <th class="px-5 py-3 border-b-2 border-gray-100 bg-gray-50 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Price</th>
                                        <th class="px-5 py-3 border-b-2 border-gray-100 bg-gray-50 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="product-list">
                                    <tr><td colspan="5" class="p-8 text-center text-gray-400">Loading products...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- VIEW: COLLECTIONS -->
            <div id="view-collections" class="flex-1 flex flex-col h-full hidden">
                <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-4 md:px-8 shrink-0">
                    <h2 class="text-lg font-bold">Collections</h2>
                    <button onclick="openModal('collection')" class="bg-black hover:bg-gray-800 text-white px-4 py-2 rounded text-sm font-bold flex items-center shadow-sm">
                        <i data-feather="plus" class="w-4 h-4 mr-2"></i> <span class="hidden md:inline">Add Collection</span><span class="md:hidden">Add</span>
                    </button>
                </header>

                <div class="p-4 md:p-8 overflow-y-auto flex-1 bg-gray-50">
                    <div class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="min-w-full leading-normal">
                                <thead>
                                    <tr>
                                        <th class="px-5 py-3 border-b-2 border-gray-100 bg-gray-50 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Cover</th>
                                        <th class="px-5 py-3 border-b-2 border-gray-100 bg-gray-50 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Details</th>
                                        <th class="px-5 py-3 border-b-2 border-gray-100 bg-gray-50 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="collection-list">
                                    <tr><td colspan="4" class="p-8 text-center text-gray-400">Loading collections...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- VIEW: MEDIA MANAGER -->
            <div id="view-media" class="flex-1 flex flex-col h-full hidden">
                <header class="bg-white border-b border-gray-200 h-16 flex items-center px-4 md:px-8 shrink-0">
                    <h2 class="text-lg font-bold">Media Manager</h2>
                </header>
                <div class="p-4 md:p-8 overflow-y-auto flex-1 bg-gray-50">
                    <form id="media-form" class="bg-white rounded-lg shadow-sm border border-gray-100 p-6 max-w-3xl mx-auto space-y-8">
                        <!-- Video Section -->
                        <div class="space-y-4 border-b border-gray-100 pb-8">
                            <div class="flex items-center space-x-2 mb-4">
                                <i data-feather="video" class="text-sky-500"></i>
                                <h3 class="text-md font-bold text-gray-900 uppercase tracking-widest">Homepage Video</h3>
                            </div>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Video Title</label>
                                    <input type="text" id="m-video-title" class="block w-full border-gray-200 rounded-md bg-gray-50 focus:bg-white focus:ring-black focus:border-black transition p-2.5 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Subtitle</label>
                                    <input type="text" id="m-video-subtitle" class="block w-full border-gray-200 rounded-md bg-gray-50 focus:bg-white focus:ring-black focus:border-black transition p-2.5 text-sm">
                                </div>
                            </div>
                            
                            <!-- Video Upload -->
                            <div class="bg-gray-50 p-4 rounded-lg border border-gray-100 border-dashed">
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Video File (MP4)</label>
                                <input type="file" id="m-video-file" accept="video/*" class="text-sm block w-full text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100">
                                <input type="hidden" id="m-video-url">
                                <div id="m-video-progress" class="hidden w-full bg-gray-200 rounded-full h-1 mt-3"><div class="bg-sky-600 h-1 rounded-full" style="width: 50%"></div></div>
                                <p id="m-current-video" class="text-xs text-green-600 mt-2 truncate font-mono"></p>
                            </div>
                            
                            <!-- Poster Upload -->
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Thumbnail Image</label>
                                <div class="flex items-center space-x-4">
                                    <img id="m-poster-preview" src="" class="w-16 h-10 object-cover bg-gray-200 rounded shadow-sm">
                                    <input type="file" id="m-poster-file" accept="image/*" class="text-sm block w-full text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200">
                                    <input type="hidden" id="m-poster-url">
                                </div>
                                <div id="m-poster-progress" class="hidden w-full bg-gray-200 rounded-full h-1 mt-2"><div class="bg-sky-600 h-1 rounded-full" style="width: 50%"></div></div>
                            </div>
                        </div>
                        
                        <!-- Audio Section -->
                        <div class="space-y-4">
                            <div class="flex items-center space-x-2 mb-4">
                                <i data-feather="music" class="text-sky-500"></i>
                                <h3 class="text-md font-bold text-gray-900 uppercase tracking-widest">Audio Player</h3>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Song Title</label>
                                    <input type="text" id="m-song-title" class="block w-full border-gray-200 rounded-md bg-gray-50 focus:bg-white focus:ring-black focus:border-black transition p-2.5 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Artist Name</label>
                                    <input type="text" id="m-artist-name" class="block w-full border-gray-200 rounded-md bg-gray-50 focus:bg-white focus:ring-black focus:border-black transition p-2.5 text-sm">
                                </div>
                            </div>
                            <!-- Audio Upload -->
                            <div class="bg-gray-50 p-4 rounded-lg border border-gray-100 border-dashed">
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Audio File (MP3)</label>
                                <input type="file" id="m-audio-file" accept="audio/*" class="text-sm block w-full text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
                                <input type="hidden" id="m-audio-url">
                                <div id="m-audio-progress" class="hidden w-full bg-gray-200 rounded-full h-1 mt-3"><div class="bg-sky-600 h-1 rounded-full" style="width: 50%"></div></div>
                                <p id="m-current-audio" class="text-xs text-green-600 mt-2 truncate font-mono"></p>
                            </div>
                        </div>
                        <div class="pt-4">
                            <button type="submit" id="media-save-btn" class="w-full px-6 py-4 bg-black text-white rounded-md font-bold hover:bg-gray-900 transition shadow-lg text-sm uppercase tracking-widest">Update Media Settings</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Product Modal -->
    <div id="product-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="relative w-full max-w-lg bg-white rounded-xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden animate-modal-enter">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-white sticky top-0 z-10">
                <h3 class="text-lg font-black tracking-tight" id="modal-title">Add Product</h3>
                <button onclick="closeModal()" class="p-2 hover:bg-gray-100 rounded-full transition"><i data-feather="x" class="w-5 h-5"></i></button>
            </div>
            <div class="overflow-y-auto p-6 bg-gray-50 flex-1">
                <form id="product-form" class="space-y-5">
                    <input type="hidden" id="p-id">
                    
                    <div class="space-y-3">
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide">Image</label>
                        <div class="flex items-start space-x-4">
                            <div id="p-img-preview" class="w-24 h-24 bg-gray-200 rounded-lg flex-shrink-0 flex items-center justify-center overflow-hidden border border-gray-300">
                                <span class="text-[10px] text-gray-400 font-bold">NO IMG</span>
                            </div>
                            <div class="flex-1">
                                <input type="file" id="p-image-file" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-black file:text-white hover:file:bg-gray-800 transition">
                                <p class="text-[10px] text-gray-400 mt-2">Recommended: 800x1000px JPG</p>
                            </div>
                            <input type="hidden" id="p-image-url">
                        </div>
                        <div id="p-upload-progress" class="hidden w-full bg-gray-200 rounded-full h-1"><div class="bg-sky-600 h-1 rounded-full" style="width: 50%"></div></div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Product Name</label>
                        <input type="text" id="p-name" required class="block w-full border-gray-200 rounded-md p-3 text-sm focus:ring-black focus:border-black transition">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Category</label>
                            <select id="p-category" class="block w-full border-gray-200 rounded-md p-3 text-sm focus:ring-black focus:border-black transition">
                                <option value="Apparel">Apparel</option>
                                <option value="Jewelry">Jewelry</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Price (K)</label>
                            <input type="number" id="p-price" required class="block w-full border-gray-200 rounded-md p-3 text-sm focus:ring-black focus:border-black transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Collection</label>
                        <select id="p-collection" class="block w-full border-gray-200 rounded-md p-3 text-sm focus:ring-black focus:border-black transition">
                            <option value="">None</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Description</label>
                        <textarea id="p-desc" rows="3" class="block w-full border-gray-200 rounded-md p-3 text-sm focus:ring-black focus:border-black transition"></textarea>
                    </div>
                </form>
            </div>
            <div class="p-5 border-t border-gray-100 bg-white sticky bottom-0 z-10 flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-5 py-2.5 rounded-md text-sm font-bold text-gray-500 hover:bg-gray-100 transition">Cancel</button>
                <button onclick="document.getElementById('product-form').dispatchEvent(new Event('submit'))" id="save-btn" class="px-6 py-2.5 bg-black text-white rounded-md text-sm font-bold hover:bg-gray-800 transition shadow-lg">Save Product</button>
            </div>
        </div>
    </div>

    <!-- Collection Modal -->
    <div id="collection-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="relative w-full max-w-lg bg-white rounded-xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden animate-modal-enter">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-white sticky top-0 z-10">
                <h3 class="text-lg font-black tracking-tight" id="c-modal-title">Add Collection</h3>
                <button onclick="closeModal()"><i data-feather="x" class="w-5 h-5"></i></button>
            </div>
            <div class="overflow-y-auto p-6 bg-gray-50 flex-1">
                <form id="collection-form" class="space-y-5">
                    <input type="hidden" id="c-id">
                    
                    <div class="space-y-3">
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide">Cover Image</label>
                        <div class="flex items-start space-x-4">
                            <div id="c-img-preview" class="w-24 h-24 bg-gray-200 rounded-lg flex-shrink-0 flex items-center justify-center overflow-hidden border border-gray-300">
                                <span class="text-[10px] text-gray-400 font-bold">NO IMG</span>
                            </div>
                            <div class="flex-1">
                                <input type="file" id="c-image-file" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-black file:text-white hover:file:bg-gray-800 transition">
                            </div>
                            <input type="hidden" id="c-image-url">
                        </div>
                        <div id="c-upload-progress" class="hidden w-full bg-gray-200 rounded-full h-1"><div class="bg-sky-600 h-1 rounded-full" style="width: 50%"></div></div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Title</label>
                        <input type="text" id="c-title" required class="block w-full border-gray-200 rounded-md p-3 text-sm focus:ring-black focus:border-black transition">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Description</label>
                        <textarea id="c-desc" rows="3" class="block w-full border-gray-200 rounded-md p-3 text-sm focus:ring-black focus:border-black transition"></textarea>
                    </div>
                </form>
            </div>
            <div class="p-5 border-t border-gray-100 bg-white sticky bottom-0 z-10 flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-5 py-2.5 rounded-md text-sm font-bold text-gray-500 hover:bg-gray-100 transition">Cancel</button>
                <button onclick="document.getElementById('collection-form').dispatchEvent(new Event('submit'))" id="c-save-btn" class="px-6 py-2.5 bg-black text-white rounded-md text-sm font-bold hover:bg-gray-800 transition shadow-lg">Save Collection</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/admin.js"></script>
    <style>
        @keyframes modal-enter {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-modal-enter {
            animation: modal-enter 0.2s ease-out forwards;
        }
    </style>
</body>
</html>
